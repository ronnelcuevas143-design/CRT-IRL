<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRT + IRL Scanner</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--bd:#30363d;--g:#2ea043;--r:#f85149;--b:#58a6ff}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 10px}h2{font-size:15px;margin:14px 2px 6px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px}
select,input[type=number],input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px;font-size:14px;width:100%}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
.full{grid-column:1/-1}
button{background:var(--b);color:#000;border:0;border-radius:8px;padding:11px;font-weight:700;font-size:15px;width:100%}
button.sec{background:var(--card);color:var(--mu);border:1px solid var(--bd);margin-top:6px;font-weight:600;font-size:13px}
button:disabled{opacity:.5}
#st{color:var(--mu);font-size:12px;margin:8px 2px}
.res{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
.res.bull{border-left-color:var(--g)}.res.bear{border-left-color:var(--r)}
.hd{display:flex;justify-content:space-between;font-weight:700}
.bull .sd{color:var(--g)}.bear .sd{color:var(--r)}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:12px}
.gr span{color:var(--mu);display:block;font-size:10px}
.tag{font-size:11px;color:var(--mu);margin-top:6px}
.irl{color:var(--b)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
</style></head><body>
<h1>CRT + IRL Scanner</h1>
<div class="panel">
 <label>Data source<select id="src"><option value="binance">Binance Futures</option><option value="mexc">MEXC Futures</option></select></label>
 <label>CRT Timeframe<select id="tf"><option value="ALL">ALL (1H+4H+1D+1W)</option><option>15m</option><option>1H</option><option selected>4H</option><option>1D</option><option>1W</option></select></label>
 <label>Top coins (by volume)<input type="number" id="top" value="100" min="10" max="400"></label>
 <label>Lookback (C2 sa huling n closed candles)<input type="number" id="look" value="1" min="1" max="5"></label>
 <label>Max candles C1 → C2<input type="number" id="gap" value="4" min="1" max="10"></label>
 <label>Min RR<input type="number" id="rr" value="1" step="0.5" min="0"></label>
 <label class="chk"><input type="checkbox" id="irl" checked> IRL (FVG)</label>
 <label class="chk"><input type="checkbox" id="pd"> PDH / PDL</label>
 <label class="chk full"><input type="checkbox" id="strict" checked> Strict (match reel): Long = C1 bearish + C2 bullish, C1 close sa loob ng IRL. Short = baliktad</label>
 <label class="full">Discord webhook (optional)<input type="text" id="wh" placeholder="https://discord.com/api/webhooks/..."></label>
 <label class="chk full"><input type="checkbox" id="auto"> Auto-scan every 5 min</label>
 <div class="full"><button id="go">SCAN</button></div>
</div>
<div id="st">Ready.</div>
<h2>Active setups (saved)</h2><div id="act"></div>
<button id="clra" class="sec">Clear all active</button>
<h2>Stats (backtest: entry = open ng C3)</h2><div id="stats" class="tw"></div>
<h2>History (TP / SL hit)</h2><div id="hist"></div>
<button id="exp" class="sec">Export history (CSV)</button>
<button id="clr" class="sec">Clear history</button>
<script>
const $=id=>document.getElementById(id);
const TF={'15m':{m:'Min15',b:'15m',s:900},'1H':{m:'Min60',b:'1h',s:3600},'4H':{m:'Hour4',b:'4h',s:14400},'1D':{m:'Day1',b:'1d',s:86400},'1W':{m:'Week1',b:'1w',s:604800}};
const ALLTF=['1H','4H','1D','1W'],PDTF=['15m','1H','4H'],TFO=['15m','1H','4H','1D','1W'];
const TVI={'15m':'15','1H':'60','4H':'240','1D':'D','1W':'W'};
const sent=new Set();let timer=null;

// ---- settings ----
const SET=['src','tf','top','look','gap','rr','irl','pd','strict','wh'];
function loadSet(){try{const s=JSON.parse(localStorage.getItem('crtirl_set')||'{}');for(const k of SET){if(!(k in s))continue;const el=$(k);if(el.type==='checkbox')el.checked=s[k];else el.value=s[k]}}catch(e){}}
function saveSet(){try{const s={};for(const k of SET){const el=$(k);s[k]=el.type==='checkbox'?el.checked:el.value}localStorage.setItem('crtirl_set',JSON.stringify(s))}catch(e){}}

// ---- data ----
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function universe(src,n){
 if(src==='mexc'){const j=await jget('https://contract.mexc.com/api/v1/contract/ticker');
  return j.data.filter(x=>x.symbol.endsWith('_USDT')).sort((a,b)=>b.amount24-a.amount24).slice(0,n).map(x=>x.symbol)}
 const j=await jget('https://fapi.binance.com/fapi/v1/ticker/24hr');
 return j.filter(x=>x.symbol.endsWith('USDT')).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,n).map(x=>x.symbol)}
async function klines(src,sym,tf){
 if(src==='mexc'){const d=(await jget(`https://contract.mexc.com/api/v1/contract/kline/${sym}?interval=${TF[tf].m}`)).data;
  return d.time.map((t,i)=>({t,o:+d.open[i],h:+d.high[i],l:+d.low[i],c:+d.close[i]})).slice(-300)}
 const j=await jget(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${TF[tf].b}&limit=300`);
 return j.map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4]}))}

//<<CORE
// IRL = unmitigated FVG (same TF) completed before C1; CRT extreme (and C1 close in strict) must be inside it
function findIRL(cs,end,ref,bull,cl){
 for(let k=end-1;k>=Math.max(2,end-60);k--){
  const a=cs[k-2],c=cs[k];let lo,hi;
  if(bull){if(c.l>a.h){lo=a.h;hi=c.l}else continue}
  else{if(c.h<a.l){lo=c.h;hi=a.l}else continue}
  let dead=false;
  for(let m=k+1;m<=end;m++){if(bull?cs[m].c<lo:cs[m].c>hi){dead=true;break}}
  if(dead)continue;
  const tol=cl==null?(hi-lo)*0.1:0;
  if(ref>=lo-tol&&ref<=hi+tol&&(cl==null||(cl>=lo-tol&&cl<=hi+tol)))return{lo,hi}}
 return null}

// previous day's daily candle (the day before the day that contains time t)
function prevDay(daily,t){
 if(!daily)return null;
 for(let k=1;k<daily.length;k++){
  if(daily[k].t<=t&&t<daily[k].t+86400){return Math.abs(daily[k].t-daily[k-1].t-86400)<3600?daily[k-1]:null}}
 return null}

// C1 = any candle up to `gap` candles before C2. Candles between C1 and C2 stay inside C1's range.
// C2 = first candle that leaves C1's range on ONE side and closes back inside it.
function analyze(sym,cs,tf,o,daily){
 if(o.pd&&!PDTF.includes(tf))return[];
 const sec=TF[tf].s,now=Date.now()/1000;
 cs=cs.slice(-300);
 const lc=cs.length-1-((cs.length&&cs[cs.length-1].t+sec>now)?1:0);
 const out=[];
 for(let back=0;back<o.look;back++){
  const j=lc-back;if(j<5)break;
  const c2=cs[j];
  for(const bull of[true,false]){
   for(let g=1;g<=o.gap;g++){
    const i1=j-g;if(i1<3)break;
    const c1=cs[i1];
    let inside=true;
    for(let m=i1+1;m<j;m++){if(cs[m].h>c1.h||cs[m].l<c1.l){inside=false;break}}
    if(!inside)continue;
    const ok=bull?(c2.l<c1.l&&c2.h<=c1.h&&c2.c>c1.l&&c2.c<c1.h):(c2.h>c1.h&&c2.l>=c1.l&&c2.c<c1.h&&c2.c>c1.l);
    if(!ok)continue;
    if(o.strict&&!(bull?(c1.c<c1.o&&c2.c>c2.o):(c1.c>c1.o&&c2.c<c2.o)))continue;
    const z=findIRL(cs,i1,bull?c1.l:c1.h,bull,o.strict?c1.c:null);
    let pd=null;
    if(o.pd){const p=prevDay(daily,c2.t);if(p){if(bull&&c2.l<=p.l)pd=p.l;if(!bull&&c2.h>=p.h)pd=p.h}}
    if(o.irl&&!z)continue;
    if(o.pd&&pd==null)continue;
    const c3=cs[j+1];
    const entry=c3?c3.o:c2.c,t3=c3?c3.t:c2.t+sec;
    const sl=bull?c2.l:c2.h,tp=bull?c1.h:c1.l;
    const risk=bull?entry-sl:sl-entry,reward=bull?tp-entry:entry-tp;
    if(risk<=0||reward<=0)continue;
    const rr=reward/risk;if(rr<o.rr)continue;
    out.push({sym,side:bull?'bull':'bear',entry,sl,tp,rr,z,pd,crtH:c1.h,crtL:c1.l,t:c2.t,t1:c1.t,t3,gap:g,back,v:2});
    break}}}
 return out}
//>>CORE

// ---- display ----
const f=n=>+n.toPrecision(6);
const ts=t=>new Date(t*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const tv=r=>`https://www.tradingview.com/chart/?symbol=${r.src==='mexc'?'MEXC':'BINANCE'}:${r.sym.replace('_','')}.P&interval=${TVI[r.tf]||'240'}`;
const trigTag=r=>r.z&&r.pd?'IRL+PDH/PDL':r.z?'IRL':r.pd?'PDH/PDL':'Walang IRL/PDH-PDL';
function card(r,extra){
 const sec=TF[r.tf]?TF[r.tf].s:0,now=Date.now()/1000,t3=r.t3||r.t+sec;
 const c3=now<t3+sec?'C3: ongoing, hindi pa nag-close':'C3: nag-close na';
 const bull=r.side==='bull';
 const trig=[r.z?`IRL ✔ FVG ${f(r.z.lo)} – ${f(r.z.hi)}`:'',r.pd?`${bull?'PDL':'PDH'} ✔ ${f(r.pd)}`:''].filter(Boolean).join(' · ')||'Walang IRL/PDH-PDL match';
 return `<div class="res ${r.side}"><div class="hd"><a href="${tv(r)}" target="_blank" rel="noopener" style="color:var(--tx);text-decoration:underline">${r.sym} 📈 ${r.tf||''}</a><span class="sd">${bull?'🟢 LONG (Bull CRT)':'🔴 SHORT (Bear CRT)'}</span></div>
 <div class="gr"><div><span>Entry (open C3)</span>${f(r.entry)}</div><div><span>SL (C2 ${bull?'low':'high'})</span>${f(r.sl)}</div><div><span>TP (CRT ${bull?'H':'L'})</span>${f(r.tp)}</div><div><span>RR</span>${r.rr.toFixed(2)}</div></div>
 <div class="tag">CRT H ${f(r.crtH)} · CRT L ${f(r.crtL)}</div>
 <div class="tag irl">${trig}</div>
 <div class="tag">C1: ${ts(r.t1||r.t-sec)} · C2: ${ts(r.t)} (C1→C2: ${r.gap||1} candle) · ${c3} (bukas ${ts(t3)})<br>Oras = oras ng pagbukas ng candle, kapareho ng TradingView${r.v?'':' · (lumang rules, hindi kasama sa stats)'}</div>${extra||''}</div>`}

async function discord(r){
 const url=$('wh').value.trim();if(!url)return;
 const key=idOf(r);if(sent.has(key))return;sent.add(key);
 const msg=`${r.side==='bull'?'🟢 LONG':'🔴 SHORT'} **${r.sym}** — CRT (${r.tf}) · ${trigTag(r)}\nEntry (open C3) ${f(r.entry)} | SL ${f(r.sl)} | TP ${f(r.tp)} | RR ${r.rr.toFixed(2)}`;
 try{await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})})}catch(e){}}

// ---- saved setups ----
const K_ACT='crtirl_active',K_HIS='crtirl_hist',HMAX=2000;
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let active=load(K_ACT),hist=load(K_HIS);
const idOf=r=>`${r.src}|${r.tf}|${r.sym}|${r.side}|${r.t1||''}|${r.t}`;

// first candle from C3 onward that touches SL or TP (both in one candle = SL, conservative)
function resolve(r,cs){
 const bull=r.side==='bull';
 for(const c of cs){
  if(c.t<=r.t)continue;
  const sl=bull?c.l<=r.sl:c.h>=r.sl,tp=bull?c.h>=r.tp:c.l<=r.tp;
  if(sl)return{res:'SL',t:c.t};
  if(tp)return{res:'TP',t:c.t}}
 return null}

function statsHTML(){
 const H=hist.filter(r=>r.v===2&&r.res);
 if(!H.length)return '<div class="tag">Wala pang stats. Lalabas dito kapag may TP/SL na.</div>';
 const g={};
 const add=(k,r)=>{const x=g[k]||(g[k]={tp:0,sl:0,r:0});if(r.res==='TP'){x.tp++;x.r+=r.rr}else{x.sl++;x.r-=1}};
 for(const r of H){const sd=r.side==='bull'?'Long':'Short';add('ALL',r);add(sd.toUpperCase(),r);add(r.tf+' '+sd,r);add('Trigger: '+trigTag(r),r)}
 const rank=k=>k==='ALL'?0:k==='LONG'?1:k==='SHORT'?2:k.startsWith('Trigger')?100:10+TFO.indexOf(k.split(' ')[0])*2+(k.endsWith('Long')?0:1);
 const rows=Object.keys(g).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b)).map(k=>{
  const x=g[k],n=x.tp+x.sl;
  return `<tr><td>${k}</td><td>${x.tp}</td><td>${x.sl}</td><td>${(x.tp/n*100).toFixed(0)}%</td><td style="color:${x.r>=0?'var(--g)':'var(--r)'}">${x.r>=0?'+':''}${x.r.toFixed(1)}R</td></tr>`}).join('');
 return `<table><tr><th>Grupo</th><th>TP</th><th>SL</th><th>Win%</th><th>Total R</th></tr>${rows}</table><div class="tag">R: TP = +RR ng setup, SL = -1R. Kasama ang mga setup na nakitang tapos na.</div>`}

function render(){
 $('act').innerHTML=active.length?active.map(r=>card(r,`<div class="tag">${r.src.toUpperCase()} · ${r.tf} · Now ${r.now?f(r.now):'-'} · <a href="#" data-rm="${idOf(r)}" style="color:var(--r)">remove</a></div>`)).join(''):'<div class="tag">No active setups saved.</div>';
 $('stats').innerHTML=statsHTML();
 $('hist').innerHTML=hist.slice(0,30).map(r=>card(r,`<div class="tag"><b style="color:${r.res==='TP'?'var(--g)':'var(--r)'}">${r.res} HIT</b> · candle ${ts(r.rt)}${r.late?' · nakita na tapos na bago ma-scan':''}</div>`)).join('')+(hist.length>30?`<div class="tag">Ipinapakita ang pinakabagong 30 sa ${hist.length}. Lahat ay nasa CSV export.</div>`:'')}

async function updateActive(){
 const cache={},keep=[];
 for(const r of active){
  try{
   const key=r.src+'|'+r.tf+'|'+r.sym;
   if(!cache[key])cache[key]=await klines(r.src,r.sym,r.tf);
   const cs=cache[key];r.now=cs[cs.length-1].c;
   const h=resolve(r,cs);
   if(h){if(r.fresh){r.late=true;delete r.fresh}r.res=h.res;r.rt=h.t;hist.unshift(r);continue}}
  catch(e){}
  if(r.fresh){delete r.fresh;discord(r)}
  keep.push(r)}
 active=keep;hist=hist.slice(0,HMAX);
 save(K_ACT,active);save(K_HIS,hist);render()}

function exportCSV(){
 const iso=t=>t?new Date(t*1000).toISOString():'';
 const rows=[['symbol','tf','side','entry_open_C3','sl','tp','rr','result','result_candle_time','C1_open','C2_open','C3_open','trigger','found_already_done','legacy_rules']];
 for(const r of hist)rows.push([r.sym,r.tf,r.side,r.entry,r.sl,r.tp,r.rr.toFixed(2),r.res,iso(r.rt),iso(r.t1),iso(r.t),iso(r.t3),trigTag(r),r.late?1:0,r.v?0:1]);
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([rows.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));
 a.download='crt-irl-history.csv';document.body.appendChild(a);a.click();a.remove()}

async function scan(){
 let src=$('src').value;
 const tfs=$('tf').value==='ALL'?ALLTF:[$('tf').value];
 const o={look:+$('look').value||1,gap:+$('gap').value||4,irl:$('irl').checked,pd:$('pd').checked,rr:+$('rr').value||0,strict:$('strict').checked};
 saveSet();$('go').disabled=true;
 let list;
 try{$('st').textContent='Loading symbols...';list=await universe(src,+$('top').value||100)}
 catch(e){
  if(src==='mexc'){
   try{src='binance';$('src').value='binance';$('st').textContent='MEXC blocked, switching to Binance...';list=await universe(src,+$('top').value||100)}
   catch(e2){$('st').textContent='Error: '+e2.message+' (MEXC and Binance both failed)';$('go').disabled=false;return}
  }else{$('st').textContent='Error loading symbols: '+e.message;$('go').disabled=false;return}}
 const found=[];let done=0,fail=0;
 for(let i=0;i<list.length;i+=6){
  await Promise.all(list.slice(i,i+6).map(async s=>{
   const cache={},get=async t=>cache[t]||(cache[t]=await klines(src,s,t));
   try{for(const tf of tfs){
     if(o.pd&&!PDTF.includes(tf))continue;
     const cs=await get(tf),daily=o.pd?await get('1D'):null;
     found.push(...analyze(s,cs,tf,o,daily).map(r=>({...r,src,tf})))}}
   catch(e){fail++}
   done++;$('st').textContent=`Scanning ${done}/${list.length} · found ${found.length}`}))}
 let added=0;
 for(const r of found){
  const id=idOf(r);
  if(!active.some(a=>idOf(a)===id)&&!hist.some(h=>idOf(h)===id)){r.fresh=true;active.push(r);added++}}
 $('st').textContent='Checking saved setups for TP/SL...';
 await updateActive();
 active.sort((a,b)=>b.t-a.t);save(K_ACT,active);render();
 const skip=o.pd&&tfs.some(t=>!PDTF.includes(t))?' · PDH/PDL: walang 1D/1W':'';
 $('st').textContent=`Done: ${list.length} coins · ${added} new · ${active.length} active${fail?` · ${fail} failed`:''}${skip} · ${new Date().toLocaleTimeString()}`;
 $('go').disabled=false}

$('go').onclick=scan;
$('act').onclick=e=>{const id=e.target.dataset&&e.target.dataset.rm;if(!id)return;e.preventDefault();active=active.filter(a=>idOf(a)!==id);save(K_ACT,active);render()};
$('clra').onclick=()=>{if(confirm('Clear all active setups?')){active=[];save(K_ACT,active);render()}};
$('clr').onclick=()=>{if(confirm('Clear all history and stats?')){hist=[];save(K_HIS,hist);render()}};
$('exp').onclick=exportCSV;
$('auto').onchange=e=>{clearInterval(timer);if(e.target.checked){scan();timer=setInterval(scan,300000)}};
loadSet();render();updateActive();
</script></body></html>
